<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>招聘表单浏览器回归汇总</title>
<style>body { font: 16px system-ui; padding: 20px; } iframe { width: 100%; height: 640px; } .pass { color: green; } .fail { color: red; }</style>
<h1>招聘表单浏览器回归汇总</h1>
<pre id="results">运行中…</pre>
<iframe title="当前回归表单"></iframe>
<script>
(async () => {
  const frame = document.querySelector("iframe");
  const output = document.getElementById("results");
  const cases = ["native", "component", "phoenix", "phoenix-year-title", "phoenix-rerender", "phoenix-misleading", "phoenix-full-date", "cascade", "atsx"];
  const results = [];
  for (const name of cases) {
    output.textContent = [...results, `运行中：${name}`].join("\n");
    frame.src = `mock-form.html?ui=${name}`;
    const deadline = Date.now() + 300000;
    let result = "";
    while (Date.now() < deadline) {
      await new Promise((resolve) => setTimeout(resolve, 500));
      if (!frame.contentWindow.location.search.includes(`ui=${name}`)) continue;
      result = frame.contentDocument.getElementById("result")?.textContent || "";
      if (/^(PASS|FAIL)/.test(result)) break;
    }
    results.push(/^(PASS|FAIL)/.test(result) ? result.split("\n").filter((line) => /^(PASS|FAIL|✗)/.test(line)).join(" | ") : `FAIL ${name} 超时`);
  }
  output.textContent = results.join("\n");
  output.className = results.every((result) => result.startsWith("PASS")) ? "pass" : "fail";
})().catch((error) => { document.getElementById("results").textContent += `\nFAIL ${error.message}`; });
</script>
</html>
